version: '3.8'

services:
  backend:
    build:
      context: .
    container_name: ai_translation_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/backend
      - ./media:/backend/media      
    env_file:
      - .env
    command: sh -c "crond && python manage.py migrate && gunicorn ai_translation.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 900 --worker-class gevent --log-level info"

  frontend:
    build:
      context: .
    container_name: ai_translation_frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/backend
      - ./media:/backend/media
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    command: >
      sh -c "streamlit run app.py"
    depends_on:
      - backend

volumes:
  db-data:
